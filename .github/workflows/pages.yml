name: Build and deploy Nolane Infinite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate static app
        run: |
          node --check app.js
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --test tests/*.test.mjs
          node scripts/validate.mjs
          test -s index.html
          test -s styles.css
          test -s manifest.webmanifest
          test -s sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"

      - name: Assemble site artifact
        run: |
          mkdir -p _site/downloads
          cp index.html styles.css app.js manifest.webmanifest sw.js icon.svg _site/
          zip -rq _site/downloads/nolane-browser-companion-0.2.4.zip extension/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/pages-site.json" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled. Deployment will proceed."
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages not enabled::The static site artifact was built successfully. Enable Pages in Settings > Pages and select GitHub Actions to activate deployment."
          else
            echo "::error title=Could not check GitHub Pages::GitHub API returned HTTP $status."
            cat "$RUNNER_TEMP/pages-site.json"
            exit 1
          fi

      - name: Configure Pages
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Keep build green while Pages awaits setup
        if: ${{ steps.pages.outputs.enabled != 'true' }}
        run: echo "Build artifact is ready; deployment will start automatically after Pages is enabled."
