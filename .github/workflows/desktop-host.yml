name: Build Native WebView2 Host

on:
  push:
    branches: ["main"]
    paths:
      - "desktop-host/**"
      - "native-diagnostics/**"
      - "app.js"
      - "native-bridge.js"
      - "tests/**"
      - "scripts/validate.mjs"
      - "styles.css"
      - ".github/workflows/desktop-host.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "desktop-host/**"
      - "native-diagnostics/**"
      - "app.js"
      - "native-bridge.js"
      - "tests/**"
      - "scripts/validate.mjs"
      - "styles.css"
      - ".github/workflows/desktop-host.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "native-webview2-host-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Validate browser bridge and workspace contracts
        shell: pwsh
        run: |
          node --version
          node --check app.js
          node --check native-bridge.js
          node --test tests/*.test.mjs
          node scripts/validate.mjs

      - name: Compile isolated WebView2 projection smoke test
        shell: pwsh
        run: |
          dotnet --version
          dotnet restore native-diagnostics/WebView2ProjectionSmokeTest.csproj -r win-x64
          $webView2Projection = Join-Path $env:USERPROFILE ".nuget/packages/microsoft.web.webview2/1.0.3179.45/lib_manual/net8.0-windows10.0.17763.0/Microsoft.Web.WebView2.Core.Projection.dll"
          if (-not (Test-Path $webView2Projection)) { throw "WebView2 CsWinRT projection DLL not found after restore: $webView2Projection" }
          Write-Host "Using restored WebView2 CsWinRT projection: $webView2Projection"
          dotnet build native-diagnostics/WebView2ProjectionSmokeTest.csproj -c Release -r win-x64 --no-restore -p:WindowsAppSDKSelfContained=true -p:WebView2EnableCsWinRTProjection=true
          dotnet restore native-diagnostics/WinUIWebView2ControlSmokeTest/WinUIWebView2ControlSmokeTest.csproj -r win-x64
          dotnet build native-diagnostics/WinUIWebView2ControlSmokeTest/WinUIWebView2ControlSmokeTest.csproj -c Release -r win-x64 --no-restore -p:WindowsAppSDKSelfContained=true -p:WebView2EnableCsWinRTProjection=true
          dotnet restore native-diagnostics/HostCompileProbe/HostCompileProbe.csproj -r win-x64
          dotnet build native-diagnostics/HostCompileProbe/HostCompileProbe.csproj -c Release -r win-x64 --no-restore -p:WindowsAppSDKSelfContained=true -p:WebView2EnableCsWinRTProjection=true

      - name: Restore and publish native host
        shell: pwsh
        run: |
          dotnet restore desktop-host/Nolane.DesktopHost.csproj -r win-x64
          dotnet list desktop-host/Nolane.DesktopHost.csproj package --include-transitive
          $reportPath = Join-Path "${{ runner.temp }}" "webview2-reference-diagnostic.txt"
          $assetsPath = "desktop-host/obj/project.assets.json"
          $assets = Get-Content $assetsPath -Raw | ConvertFrom-Json
          "Resolved NuGet WebView2 libraries:" | Tee-Object -FilePath $reportPath
          $assets.libraries.PSObject.Properties.Name | Where-Object { $_ -match "WebView2" } | Tee-Object -FilePath $reportPath -Append
          Add-Content -Path $reportPath -Value "WebView2 assemblies and WinMDs in NuGet cache:"
          Get-ChildItem (Join-Path $env:USERPROFILE ".nuget/packages") -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "WebView2.*(dll|winmd)$" } |
            Select-Object -ExpandProperty FullName | Tee-Object -FilePath $reportPath -Append
          Add-Content -Path $reportPath -Value "MSBuild resolved ReferencePath items:"
          $referenceJson = dotnet msbuild desktop-host/Nolane.DesktopHost.csproj -t:ResolveReferences -getItem:ReferencePath -p:Configuration=Release -p:RuntimeIdentifier=win-x64
          $referenceJson | Tee-Object -FilePath $reportPath -Append
          Write-Host "WebView2 reference diagnostic written to $reportPath"
          dotnet publish desktop-host/Nolane.DesktopHost.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false -o "${{ runner.temp }}/nolane-native-host"
      - name: Package native host
        shell: pwsh
        run: |
          $output = "${{ runner.temp }}/nolane-native-host"
          if (-not (Test-Path (Join-Path $output "Nolane.DesktopHost.exe"))) { throw "The native host executable was not produced." }
          Compress-Archive -Path (Join-Path $output "*") -DestinationPath "${{ runner.temp }}/nolane-native-webview2-host-win-x64.zip" -CompressionLevel Optimal
      - name: Publish stable Windows download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $asset = "${{ runner.temp }}/nolane-native-webview2-host-win-x64.zip"
          gh release view native-latest --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create native-latest --repo $repo --target $env:GITHUB_SHA --title "Nolane Native WebView2 Host (latest)" --notes "Rolling Windows x64 WebView2 host build from the main branch. The stable download URL always points to the newest successful main-branch build."
            if ($LASTEXITCODE -ne 0) { throw "Could not create the native-latest GitHub release." }
          }
          gh release upload native-latest $asset --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the native host release asset." }

      - name: Upload native host bundle
        uses: actions/upload-artifact@v5
        with:
          name: nolane-native-webview2-host-win-x64
          path: ${{ runner.temp }}/nolane-native-webview2-host-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload native dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nolane-native-webview2-diagnostics
          path: |
            desktop-host/obj/project.assets.json
            native-diagnostics/obj/project.assets.json
            native-diagnostics/WinUIWebView2ControlSmokeTest/obj/project.assets.json
            native-diagnostics/HostCompileProbe/obj/project.assets.json
            ${{ runner.temp }}/webview2-reference-diagnostic.txt
          if-no-files-found: warn
          retention-days: 7
